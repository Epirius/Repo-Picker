name: Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node run-tests.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump the version and tag it
        id: version
        run: |
          version=$(python3 - <<'PY'
          import json
          path = "manifest.json"
          manifest = json.load(open(path))
          parts = manifest["version"].split(".")
          while len(parts) < 3:
              parts.append("0")
          parts[-1] = str(int(parts[-1]) + 1)
          manifest["version"] = ".".join(parts)
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(manifest["version"])
          PY
          )
          tag="v$version"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists on origin, main and its tags are out of sync" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Bump version to $version"
          git tag "$tag"
          git push origin "HEAD:${{ github.ref_name }}" "$tag"

      - name: Build and submit the listed version to the marketplace
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          python3 build.py --expect-version "${{ steps.version.outputs.tag }}"
          # Listed submissions sit in AMO's human review queue, so this uploads
          # and moves on instead of blocking the job on it.
          npx --yes web-ext@10 sign \
            --source-dir dist \
            --artifacts-dir artifacts-listed \
            --channel listed \
            --approval-timeout 0 \
            --amo-metadata .github/amo-metadata.json

      - name: Build and sign an unlisted download for the GitHub release
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # AMO refuses to reuse a version number across channels, so this build
          # is stamped one build-number higher purely to get a signed .xpi back
          # immediately (unlisted signs on the spot; listed doesn't). The tracked
          # manifest.json and the marketplace listing both stay at the real version.
          python3 build.py \
            --expect-version "${{ steps.version.outputs.tag }}" \
            --set-version "${{ steps.version.outputs.version }}.1"
          npx --yes web-ext@10 sign \
            --source-dir dist \
            --artifacts-dir artifacts-unlisted \
            --channel unlisted

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --generate-notes
          gh release upload "${{ steps.version.outputs.tag }}" artifacts-unlisted/*.xpi --clobber
