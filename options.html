<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub repo omnibox</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1b1b1d;
        --muted: #5b5b66;
        --bg: #ffffff;
        --field: #ffffff;
        --border: #cfcfd8;
        --accent: #0060df;
        --error: #c50042;
        --ok: #00754d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f9f9fb;
          --muted: #b1b1bb;
          --bg: #1c1b22;
          --field: #2b2a33;
          --border: #52525e;
          --accent: #00ddff;
          --error: #ff9aa2;
          --ok: #54ffbd;
        }
      }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
        margin: 0;
        padding: 32px 16px;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lede {
        color: var(--muted);
        margin: 0 0 28px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 4px 0 0;
      }
      .field {
        margin-bottom: 20px;
      }
      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        color: var(--fg);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .check label {
        font-weight: 400;
        margin: 0;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--field);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #status {
        margin-top: 20px;
        min-height: 20px;
      }
      #status.error {
        color: var(--error);
      }
      #status.ok {
        color: var(--ok);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GitHub repo omnibox</h1>
      <p class="lede">
        Type <code>gh</code> in the address bar, press space, then start typing a repository name.
      </p>

      <div class="field">
        <label for="orgs">Organizations</label>
        <textarea id="orgs" spellcheck="false" placeholder="one per line"></textarea>
        <p class="hint">Every repository you can read in these orgs gets indexed.</p>
      </div>

      <div class="field">
        <label for="token">Access token</label>
        <input id="token" type="password" spellcheck="false" autocomplete="off" />
        <p class="hint">
          A fine-grained token with <em>Metadata: read</em> on the orgs, or a classic token with the
          <code>repo</code> scope. Stored in this browser profile only.
        </p>
      </div>

      <div class="field check">
        <input id="personal" type="checkbox" />
        <label for="personal">Also index repositories I own or collaborate on</label>
      </div>

      <div class="row">
        <button id="save" class="primary">Save and fetch</button>
        <button id="refresh">Refresh now</button>
      </div>

      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
